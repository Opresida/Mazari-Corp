services:
  - type: web
    name: mazari-corp
    runtime: static
    plan: free
    rootDir: .
    branch: master
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/mazari-corp run build
    staticPublishPath: artifacts/mazari-corp/dist/public
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
